name: driver
description: "ZoolGo driver app"
publish_to: none
version: 1.0.0+1
resolution: workspace
environment:
  sdk: ^3.13.0
  flutter: ">=3.38.0"
dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.5.0
  flutter_svg: ^2.5.0
  geolocator: ^14.1.2
  go_router: ^18.1.4
  intl: ^0.20.3
  latlong2: ^0.10.1
  mobile_scanner: ^7.5.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  zool_core:
    path: ../../packages/zool_core
  zool_ui:
    path: ../../packages/zool_ui
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "../../branding/app_icon.png"
  adaptive_icon_background: "#03442C"
  adaptive_icon_foreground: "../../branding/app_icon_foreground.png"
  min_sdk_android: 21
