name: broker
description: "ZoolGo broker (agent office) app"
publish_to: none
version: 1.0.0+1
resolution: workspace
environment:
  sdk: ^3.13.0
  flutter: ">=3.38.0"
dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  image_picker: ^1.2.4
  intl: ^0.20.3
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  uuid: ^4.6.0
  zool_core:
    path: ../../packages/zool_core
  zool_ui:
    path: ../../packages/zool_ui
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "../../branding/app_icon.png"
  adaptive_icon_background: "#03442C"
  adaptive_icon_foreground: "../../branding/app_icon_foreground.png"
  min_sdk_android: 21
