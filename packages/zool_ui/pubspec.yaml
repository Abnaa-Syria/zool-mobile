name: zool_ui
description: "ZoolGo design system: theme, brand tokens and shared widgets."
publish_to: none
version: 0.1.0
resolution: workspace
environment:
  sdk: ^3.13.0
  flutter: ">=3.38.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  intl: ^0.20.3
  qr_flutter: ^4.1.0
  zool_core:
    path: ../zool_core
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
